<head>

  <style>
    .badge-transit {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:28px;
      height:22px;
      border-radius:6px;
      font-weight:bold;
      font-size:11px;
      flex-shrink:0;
    }
    input, select, button, a {

    }
    input[type="number"] {
      touch-action:manipulation;
    }
  </style>
</head>

        </div>
      </div>

        <button type="button" onclick="resetAllPrices()"

          33 Otel
        </span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <div class="flex flex-col bg-slate-800 p-1.5 rounded border border-slate-700">
        <label class="text-blue-400 text-[10px] font-bold mb-0.5">
          <i data-lucide="calendar" class="w-3 h-3 inline"></i> 1. Giriş Tarihi
        </label>
        <input type="date" id="checkInDate"
          onchange="handleInChange(this.value)"
          class="bg-slate-900 text-white text-[11px] p-1 rounded border border-slate-600 w-full">
      </div>

      <div class="flex flex-col bg-slate-800 p-1.5 rounded border border-slate-700">
        <label class="text-amber-400 text-[10px] font-bold mb-0.5">
          <i data-lucide="calendar-check" class="w-3 h-3 inline"></i> 2. Çıkış Tarihi
        </label>
        <input type="date" id="checkOutDate"
          onchange="handleOutChange(this.value)"
          class="bg-slate-900 text-white text-[11px] p-1 rounded border border-slate-600 w-full">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <select id="districtFilter" onchange="renderHotels()"
        class="bg-slate-800 border border-slate-700 text-[11px] text-white rounded px-2 py-1.5 w-full">
        <option value="all">Tüm Semtler</option>
        <option value="Sultanahmet / Sirkeci">Sultanahmet / Sirkeci</option>
        <option value="Laleli / Fatih">Laleli / Fatih</option>
        <option value="Topkapı / Fındıkzade">Topkapı / Fındıkzade</option>
        <option value="Şişli / Harbiye">Şişli / Harbiye</option>
        <option value="Bayrampaşa">Bayrampaşa</option>
        <option value="Diğer Bölgeler">Diğer Bölgeler</option>
      </select>

      <select id="sortSelect" onchange="renderHotels()"
        class="bg-slate-800 border border-slate-700 text-[11px] text-white rounded px-2 py-1.5 w-full">
        <option value="priceAsc">Ucuzdan Pahalıya</option>
        <option value="ratingDesc">Puanı Yüksek</option>
        <option value="walkAsc">Durağa En Yakın</option>
      </select>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto w-full p-3 flex-1">

  <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm mb-3 text-[11px] flex flex-wrap items-center gap-2">
    <span class="font-bold text-slate-700">Ulaşım:</span>
    <div class="flex items-center gap-1.5 flex-wrap">
      <span class="badge-transit bg-emerald-600 text-white">T</span>
      <span class="text-slate-500 text-[10px]">Tramvay</span>
      <span class="badge-transit bg-blue-600 text-white">M</span>
      <span class="text-slate-500 text-[10px]">Metro</span>
      <span class="badge-transit bg-purple-600 text-white">M+T</span>

</main>

// Kayıtlı veriler
function loadStorage(key) {
  try {
    const data = JSON.parse(localStorage.getItem(key));
    return data && typeof data === "object" ? data : {};
  } catch {
    return {};
  }
}

let savedPrices = loadStorage("hotel_prices_db");
let savedBreakfast = loadStorage("hotel_breakfast_db");

function saveStorage(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify(data));
    return true;
  } catch (error) {
    alert("Veriler kaydedilemedi. Tarayıcı depolama alanını kontrol edin.");
    return false;
  }
}

function localDateString(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function addDays(dateString, days) {
  const d = new Date(dateString + "T12:00:00");
  d.setDate(d.getDate() + days);
  return localDateString(d);
}

window.addEventListener("DOMContentLoaded", () => {
  const today = new Date();
  document.getElementById("checkInDate").value = localDateString(today);
  document.getElementById("checkOutDate").value =
    localDateString(new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1));

  renderHotels();
});

function handleInChange(value) {
  if (!value) return;

  const out = document.getElementById("checkOutDate");
  if (out.value && out.value <= value) {
    out.value = addDays(value, 1);
  }
  updateBookingLinks();
}

function handleOutChange(value) {
  if (!value) return;

  const checkIn = document.getElementById("checkInDate");
  if (checkIn.value && value <= checkIn.value) {
    checkIn.value = addDays(value, -1);
  }
  updateBookingLinks();
}

function updateBookingLinks() {
  const checkIn = document.getElementById("checkInDate").value;
  const checkOut = document.getElementById("checkOutDate").value;

  document.querySelectorAll("[data-google-link]").forEach(link => {
    const hotel = hotelsData.find(h => h.id === Number(link.dataset.hotelId));
    if (hotel) {
      link.href = `https://www.google.com/travel/hotels/search?q=${encodeURIComponent(hotel.name + " " + hotel.district)}&dates=${checkIn},${checkOut}`;
    }
  });

  document.querySelectorAll("[data-trivago-link]").forEach(link => {
    const hotel = hotelsData.find(h => h.id === Number(link.dataset.hotelId));
    if (hotel) {
      link.href = `https://www.trivago.com.tr/tr/srl?q=${encodeURIComponent(hotel.name)}&checkIn=${checkIn}&checkOut=${checkOut}&adults=2`;
    }
  });
}

// Fiyat sıralaması: fiyat girilmiş oteller önce, boşlar en sonda.
function sortRenderedCards() {
  const container = document.getElementById("hotelList");
  const sort = document.getElementById("sortSelect").value;

  const cards = Array.from(container.children);

  cards.sort((cardA, cardB) => {
    const a = hotelsData.find(h => h.id === Number(cardA.dataset.hotelId));
    const b = hotelsData.find(h => h.id === Number(cardB.dataset.hotelId));

    if (sort === "priceAsc") {
      const priceA = savedPrices[a.id];
      const priceB = savedPrices[b.id];
      const hasA = priceA !== undefined && priceA !== null && priceA !== "";
      const hasB = priceB !== undefined && priceB !== null && priceB !== "";

      if (hasA && !hasB) return -1;
      if (!hasA && hasB) return 1;
      if (!hasA && !hasB) return a.id - b.id;
      return Number(priceA) - Number(priceB) || a.id - b.id;
    }

    if (sort === "ratingDesc") {
      return b.rating - a.rating || a.id - b.id;
    }

    if (sort === "walkAsc") {
      return a.walkMin - b.walkMin || a.id - b.id;
    }

    return 0;
  });

  // Kartları yeniden yaratmak yerine mevcut DOM elemanlarını taşıyoruz.
  // Böylece aktif fiyat alanı ve mobil klavye korunur.
  cards.forEach(card => container.appendChild(card));
}

function submitPrice(id) {
  const input = document.getElementById(`priceInput-${id}`);
  const card = document.querySelector(`[data-hotel-id="${id}"]`);
  if (!input || !card) return;

  const raw = input.value.trim();

  if (raw === "") {
    delete savedPrices[id];
  } else {
    const price = Number(raw);

    if (!Number.isFinite(price) || price < 0) {
      alert("Lütfen sıfır veya daha büyük geçerli bir fiyat girin.");
      input.focus();
      return;
    }

    savedPrices[id] = price;
  }

  if (!saveStorage("hotel_prices_db", savedPrices)) return;

  // Kartı yeniden oluşturma. Sadece görünümünü ve sırasını güncelle.
  const hasPrice = savedPrices[id] !== undefined;

  card.classList.toggle("border-blue-500", hasPrice);
  card.classList.toggle("ring-1", hasPrice);
  card.classList.toggle("ring-blue-200", hasPrice);
  card.classList.toggle("bg-blue-50/10", hasPrice);
  card.classList.toggle("border-slate-200", !hasPrice);

  sortRenderedCards();
}

function toggleBreakfast(id) {
  savedBreakfast[id] = !savedBreakfast[id];
  saveStorage("hotel_breakfast_db", savedBreakfast);

  const button = document.getElementById(`breakfast-${id}`);
  if (!button) return;

  const checked = !!savedBreakfast[id];

  button.className = `flex items-center gap-1 px-2 py-0.5 rounded text-[11px] transition ${
    checked
      ? "bg-emerald-100 text-emerald-800 font-medium border border-emerald-300"
      : "bg-slate-100 text-slate-500"
  }`;

  button.innerHTML = checked
    ? '<i data-lucide="check-square" class="w-3 h-3 text-emerald-600"></i><span>Kahvaltı</span>'
    : '<i data-lucide="square" class="w-3 h-3 text-slate-400"></i><span>Kahvaltı</span>';

  lucide.createIcons();
}

function resetAllPrices() {
  if (!confirm("Girmiş olduğunuz tüm otel fiyatları silinecek. Emin misiniz?")) {
    return;
  }

  savedPrices = {};
  localStorage.removeItem("hotel_prices_db");
  renderHotels();
}

function getFilteredHotels() {
  const region = document.getElementById("districtFilter").value;

  return hotelsData.filter(h =>
    region === "all" || h.region === region
  );
}

function renderHotels() {
  const container = document.getElementById("hotelList");
  const filtered = getFilteredHotels();

  document.getElementById("hotelCount").textContent = `${filtered.length} Otel`;

  const checkIn = document.getElementById("checkInDate").value;
  const checkOut = document.getElementById("checkOutDate").value;

  container.innerHTML = "";

  filtered.forEach(hotel => {
    const price = savedPrices[hotel.id] ?? "";
    const hasPrice = price !== "";
    const hasBreakfast = !!savedBreakfast[hotel.id];

    const transitColors = {
      "T": "bg-emerald-600",
      "M": "bg-blue-600",
      "M+T": "bg-purple-600",
      "O": "bg-amber-500"

    let parkingHTML;

    if (hotel.parking === "free") {
      parkingHTML = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5">
        <i data-lucide="square-parking" class="w-3.5 h-3.5"></i> Ücretsiz P</span>`;
    } else if (hotel.parking === "paid") {
      parkingHTML = `<span class="bg-amber-50 text-amber-700 border border-amber-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5">
        <i data-lucide="square-parking" class="w-3.5 h-3.5"></i> P₺ Ücretli</span>`;
    } else {
      parkingHTML = `<span class="bg-red-50 text-red-500 border border-red-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5 opacity-75">
        <i data-lucide="square-parking" class="w-3.5 h-3.5"></i> P Yok</span>`;
    }

    const googleUrl =
      `https://www.google.com/travel/hotels/search?q=${encodeURIComponent(hotel.name + " " + hotel.district)}&dates=${checkIn},${checkOut}`;

    const trivagoUrl =
      `https://www.trivago.com.tr/tr/srl?q=${encodeURIComponent(hotel.name)}&checkIn=${checkIn}&checkOut=${checkOut}&adults=2`;

    const card = document.createElement("div");

    card.dataset.hotelId = hotel.id;
    card.className =
      `bg-white p-3 rounded-xl border shadow-sm flex flex-col justify-between transition ${
        hasPrice ? "border-blue-500 ring-1 ring-blue-200 bg-blue-50/10" : "border-slate-200"
      }`;

    card.innerHTML = `
      <div>
        <div class="flex items-start justify-between gap-1 mb-1.5">
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <span class="badge-transit ${transitColors[hotel.penyeTransit]} text-white">${hotel.penyeTransit}</span>
              <h3 class="font-bold text-slate-800 text-xs sm:text-sm leading-tight">${hotel.name}</h3>
            </div>
            <span class="inline-block bg-slate-100 text-slate-600 text-[9px] px-1.5 py-0.5 rounded mt-1 font-medium">${hotel.region}</span>
          </div>
          <span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-1 py-0.5 rounded border border-amber-200 flex-shrink-0">⭐ ${hotel.rating}</span>
        </div>

        <div class="text-[11px] bg-slate-50 p-1.5 rounded-lg text-slate-600 border border-slate-100 mb-2 space-y-0.5">
          <div class="flex items-center gap-1 text-slate-700 font-medium">
            <i data-lucide="footprints" class="w-3 h-3 text-blue-500"></i>
            <span>Durağa Yürüme: <strong>${hotel.walkMin} dakika</strong></span>
          </div>
          <p class="text-[10px] text-slate-500">${hotel.transitDesc}</p>
        </div>

        <div class="flex items-center justify-between gap-1 mb-2">
          ${parkingHTML}
          <button type="button" id="breakfast-${hotel.id}"
            onclick="toggleBreakfast(${hotel.id})"
            class="flex items-center gap-1 px-2 py-0.5 rounded text-[11px] transition ${
              hasBreakfast
                ? "bg-emerald-100 text-emerald-800 font-medium border border-emerald-300"
                : "bg-slate-100 text-slate-500"
            }">
            <i data-lucide="${hasBreakfast ? "check-square" : "square"}"
              class="w-3 h-3 ${hasBreakfast ? "text-emerald-600" : "text-slate-400"}"></i>
            <span>Kahvaltı</span>
          </button>
        </div>
      </div>

      <div class="pt-2 border-t border-slate-100 space-y-1.5">
        <div class="flex items-center justify-between gap-1 bg-slate-50 p-1.5 rounded-lg border border-slate-200">
          <label for="priceInput-${hotel.id}" class="text-[11px] font-medium text-slate-600 shrink-0">
            Gördüğün Fiyat:
          </label>
          <div class="flex items-center gap-1 min-w-0">
            <span class="text-xs font-bold text-blue-600">₺</span>
            <input
              type="number"
              id="priceInput-${hotel.id}"
              inputmode="decimal"
              min="0"
              step="any"
              value="${price}"
              placeholder="Fiyat"
              autocomplete="off"
              class="w-20 min-w-0 bg-white border border-slate-300 rounded px-1.5 py-1 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500 text-right"
            >
            <button type="button"
              data-save-price="${hotel.id}"
              class="bg-blue-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow-sm active:scale-95">
              Kaydet
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-1.5">
          <a data-google-link data-hotel-id="${hotel.id}" href="${googleUrl}" target="_blank" rel="noopener noreferrer"
            class="flex items-center justify-center gap-1 bg-blue-600 text-white p-1.5 rounded-lg text-[11px] font-medium shadow-sm">
            <i data-lucide="search" class="w-3 h-3"></i><span>Google</span>
          </a>
          <a data-trivago-link data-hotel-id="${hotel.id}" href="${trivagoUrl}" target="_blank" rel="noopener noreferrer"
            class="flex items-center justify-center gap-1 bg-amber-500 text-white p-1.5 rounded-lg text-[11px] font-medium shadow-sm">
            <i data-lucide="external-link" class="w-3 h-3"></i><span>Trivago</span>
          </a>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  lucide.createIcons();
}

// Tek bir olay dinleyicisi: Kaydet butonu veya klavyedeki Enter.
document.getElementById("hotelList").addEventListener("click", event => {
  const button = event.target.closest("[data-save-price]");
  if (!button) return;

  submitPrice(Number(button.dataset.savePrice));
});

document.getElementById("hotelList").addEventListener("keydown", event => {
  if (event.key !== "Enter" || !event.target.matches('input[id^="priceInput-"]')) {
    return;
  }

  event.preventDefault();

  const id = Number(event.target.id.replace("priceInput-", ""));
  submitPrice(id);
});

</script>
</body>
</html>
