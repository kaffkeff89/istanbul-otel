<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>İstanbul Otellerim - Mobil Uyumlu</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .badge-transit { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 22px; border-radius: 6px; font-weight: bold; font-size: 11px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col font-sans pb-10">

  <!-- ÜST KONTROL PANELİ -->
  <header class="bg-slate-900 text-white p-3 shadow-md z-30 sticky top-0">
    <div class="max-w-7xl mx-auto flex flex-col gap-2.5">
      
      <!-- Başlık, Liste Sayısı ve Kırmızı Fiyat Sıfırlama Butonu -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="bg-blue-600 text-white p-1.5 rounded-lg shadow">
            <i data-lucide="building-2" class="w-4 h-4"></i>
          </div>
          <div>
            <h1 class="font-bold text-xs sm:text-sm leading-tight text-slate-100">İstanbul Otellerim</h1>
            <p class="text-[10px] text-slate-400">Penye Teks Ulaşım & Fiyat Takibi</p>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button onclick="resetAllPrices()" class="bg-red-600 hover:bg-red-700 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg border border-red-400 shadow-sm transition flex items-center gap-1 active:scale-95">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Fiyatları Sıfırla</span>
          </button>
          
          <span id="hotelCount" class="bg-blue-900/80 text-blue-200 text-[11px] font-bold px-2 py-1 rounded-lg border border-blue-700">33 Otel</span>
        </div>
      </div>

      <!-- Bağımsız İki Aşamalı Tarih Seçici -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <div class="flex flex-col bg-slate-800 p-1.5 rounded border border-slate-700">
          <label class="text-blue-400 text-[10px] font-bold mb-0.5 flex items-center gap-1">
            <i data-lucide="calendar" class="w-3 h-3"></i> 1. Giriş Tarihi
          </label>
          <input type="date" id="checkInDate" onchange="handleInChange(this.value)" class="bg-slate-900 text-white text-[11px] p-1 rounded border border-slate-600 focus:outline-none focus:border-blue-500 w-full cursor-pointer">
        </div>

        <div class="flex flex-col bg-slate-800 p-1.5 rounded border border-slate-700">
          <label class="text-amber-400 text-[10px] font-bold mb-0.5 flex items-center gap-1">
            <i data-lucide="calendar-check" class="w-3 h-3"></i> 2. Çıkış Tarihi
          </label>
          <input type="date" id="checkOutDate" onchange="handleOutChange(this.value)" class="bg-slate-900 text-white text-[11px] p-1 rounded border border-slate-600 focus:outline-none focus:border-amber-500 w-full cursor-pointer">
        </div>
      </div>

      <!-- Filtre ve Sıralama -->
      <div class="grid grid-cols-2 gap-2 text-xs">
        <select id="districtFilter" onchange="renderHotels()" class="bg-slate-800 border border-slate-700 text-[11px] text-white rounded px-2 py-1.5 focus:outline-none cursor-pointer w-full">
          <option value="all">Tüm Semtler</option>
          <option value="Sultanahmet / Sirkeci">Sultanahmet / Sirkeci</option>
          <option value="Laleli / Fatih">Laleli / Fatih</option>
          <option value="Topkapı / Fındıkzade">Topkapı / Fındıkzade</option>
          <option value="Şişli / Harbiye">Şişli / Harbiye</option>
          <option value="Bayrampaşa">Bayrampaşa</option>
          <option value="Diğer Bölgeler">Diğer Bölgeler</option>
        </select>

        <select id="sortSelect" onchange="renderHotels()" class="bg-slate-800 border border-slate-700 text-[11px] text-white rounded px-2 py-1.5 focus:outline-none cursor-pointer w-full">
          <option value="priceAsc" selected>Ucuzdan Pahalıya</option>
          <option value="ratingDesc">Puanı Yüksek</option>
          <option value="walkAsc">Durağa En Yakın</option>
        </select>
      </div>

    </div>
  </header>

  <!-- İÇERİK -->
  <main class="max-w-7xl mx-auto w-full p-3 flex-1">
    
    <!-- Rozet Açıklamaları -->
    <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm mb-3 text-[11px] flex flex-wrap items-center justify-between gap-2">
      <span class="font-bold text-slate-700">Ulaşım:</span>
      <div class="flex items-center gap-1.5 flex-wrap">
        <span class="badge-transit bg-emerald-600 text-white">T</span><span class="text-slate-500 text-[10px]">Tramvay</span>
        <span class="badge-transit bg-blue-600 text-white">M</span><span class="text-slate-500 text-[10px]">Metro</span>
        <span class="badge-transit bg-purple-600 text-white">M+T</span><span class="text-slate-500 text-[10px]">Aktarma</span>
        <span class="badge-transit bg-amber-500 text-white">O</span><span class="text-slate-500 text-[10px]">Otobüs</span>
      </div>
    </div>

    <!-- Otel Listesi -->
    <div id="hotelList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      <!-- JS Yükleyecek -->
    </div>

  </main>

  <script>
    const hotelsData = [
      { id: 1, name: "Hotel Arcadia Blue", region: "Sultanahmet / Sirkeci", district: "Sultanahmet", rating: 4.6, parking: "free", penyeTransit: "T", walkMin: 3, transitDesc: "T1 Sultanahmet durağına 3 dk yürüme." },
      { id: 2, name: "Asmalı Hotel", region: "Sultanahmet / Sirkeci", district: "Sultanahmet", rating: 4.2, parking: "paid", penyeTransit: "T", walkMin: 5, transitDesc: "T1 Sultanahmet durağına 5 dk yürüme." },
      { id: 3, name: "The Cettia Istanbul", region: "Şişli / Harbiye", district: "Şişli", rating: 4.4, parking: "none", penyeTransit: "M+T", walkMin: 6, transitDesc: "M2 Metro durağına 6 dk yürüme." },
      { id: 4, name: "Artika Hotel", region: "Sultanahmet / Sirkeci", district: "Sultanahmet", rating: 4.5, parking: "free", penyeTransit: "T", walkMin: 4, transitDesc: "T1 Çemberlitaş durağına 4 dk yürüme." },
      { id: 5, name: "Eresin Hotels Topkapı", region: "Topkapı / Fındıkzade", district: "Topkapı", rating: 4.3, parking: "free", penyeTransit: "T", walkMin: 2, transitDesc: "T1 Pazartekke durağına 2 dk yürüme." },
      { id: 6, name: "Uranus Istanbul Topkapi", region: "Topkapı / Fındıkzade", district: "Topkapı", rating: 4.4, parking: "free", penyeTransit: "M+T", walkMin: 7, transitDesc: "Cevizlibağ durağına 7 dk yürüme." },
      { id: 7, name: "Santra Hotel", region: "Laleli / Fatih", district: "Fatih", rating: 4.1, parking: "paid", penyeTransit: "M", walkMin: 5, transitDesc: "M2 Vezneciler durağına 5 dk yürüme." },
      { id: 8, name: "The Hubi Hotel", region: "Şişli / Harbiye", district: "Şişli", rating: 4.3, parking: "paid", penyeTransit: "M+T", walkMin: 5, transitDesc: "M2 Osmanbey durağına 5 dk yürüme." },
      { id: 9, name: "Garden House Hotel", region: "Sultanahmet / Sirkeci", district: "Sultanahmet", rating: 4.5, parking: "free", penyeTransit: "T", walkMin: 5, transitDesc: "T1 Çemberlitaş durağına 5 dk yürüme." },
      { id: 10, name: "Porta Romanos Hotel & Restaurant", region: "Topkapı / Fındıkzade", district: "Topkapı", rating: 4.2, parking: "paid", penyeTransit: "T", walkMin: 3, transitDesc: "T1 Topkapı durağına 3 dk yürüme." },
      { id: 11, name: "Crowne Plaza İstanbul Old City", region: "Laleli / Fatih", district: "Laleli", rating: 4.6, parking: "free", penyeTransit: "T", walkMin: 2, transitDesc: "T1 Laleli durağına 2 dk yürüme." },
      { id: 12, name: "DoubleTree by Hilton Istanbul Topkapi", region: "Topkapı / Fındıkzade", district: "Topkapı", rating: 4.5, parking: "free", penyeTransit: "M+T", walkMin: 6, transitDesc: "Tramvay/Metro durağına 6 dk yürüme." },
      { id: 13, name: "Dosso Dossi Hotels Downtown", region: "Laleli / Fatih", district: "Vatan Cad.", rating: 4.6, parking: "free", penyeTransit: "M", walkMin: 3, transitDesc: "M1 Emniyet-Fatih durağına 3 dk yürüme." },
      { id: 14, name: "Eresin Hotels Express", region: "Topkapı / Fındıkzade", district: "Topkapı", rating: 4.0, parking: "paid", penyeTransit: "T", walkMin: 2, transitDesc: "T1 Pazartekke durağına 2 dk yürüme." },
      { id: 15, name: "Grand Anka Hotel Istanbul", region: "Topkapı / Fındıkzade", district: "Fındıkzade", rating: 4.1, parking: "free", penyeTransit: "T", walkMin: 3, transitDesc: "T1 Fındıkzade durağına 3 dk yürüme." },
      { id: 16, name: "Danis Hotel & Spa Istanbul - Old City", region: "Laleli / Fatih", district: "Laleli", rating: 4.4, parking: "paid", penyeTransit: "T", walkMin: 3, transitDesc: "T1 Laleli durağına 3 dk yürüme." },
      { id: 17, name: "Golden Tulip Istanbul Bayrampasa", region: "Bayrampaşa", district: "Bayrampaşa", rating: 4.3, parking: "free", penyeTransit: "M+T", walkMin: 8, transitDesc: "M1 Sağmalcılar durağına 8 dk yürüme." },
      { id: 18, name: "Mercure İstanbul Sirkeci Hotel", region: "Sultanahmet / Sirkeci", district: "Sirkeci", rating: 4.5, parking: "paid", penyeTransit: "T", walkMin: 2, transitDesc: "T1 Sirkeci durağına 2 dk yürüme." },
      { id: 19, name: "Gen Suites Cibali", region: "Laleli / Fatih", district: "Cibali", rating: 4.2, parking: "none", penyeTransit: "O", walkMin: 4, transitDesc: "Otobüs durağına 4 dk yürüme." },
      { id: 20, name: "Crowne Plaza Istanbul - Harbiye", region: "Şişli / Harbiye", district: "Harbiye", rating: 4.4, parking: "free", penyeTransit: "M+T", walkMin: 7, transitDesc: "M2 Osmanbey durağına 7 dk yürüme." },
      { id: 21, name: "Windsor Hotel & Convention Center", region: "Bayrampaşa", district: "Bayrampaşa", rating: 4.2, parking: "free", penyeTransit: "M+T", walkMin: 6, transitDesc: "Tramvay durağına 6 dk yürüme." },
      { id: 22, name: "Gümüş Palace Hotel Güngören", region: "Diğer Bölgeler", district: "Güngören", rating: 3.9, parking: "none", penyeTransit: "T", walkMin: 4, transitDesc: "T1 Güngören durağına 4 dk yürüme." },
      { id: 23, name: "Mövenpick Istanbul Marmara Sea", region: "Diğer Bölgeler", district: "Zeytinburnu", rating: 4.6, parking: "free", penyeTransit: "M+T", walkMin: 5, transitDesc: "Marmaray Kazlıçeşme durağına 5 dk yürüme." },
      { id: 24, name: "Ramada Plaza By Wyndham City Center", region: "Şişli / Harbiye", district: "Pangaltı", rating: 4.3, parking: "paid", penyeTransit: "M", walkMin: 2, transitDesc: "M2 Osmanbey metro çıkışında." },
      { id: 25, name: "Ramada by Wyndham Istanbul Old City", region: "Topkapı / Fındıkzade", district: "Fındıkzade", rating: 4.2, parking: "paid", penyeTransit: "T", walkMin: 1, transitDesc: "T1 Fındıkzade durağında." },
      { id: 26, name: "Days Inn by Wyndham Istanbul Bomonti", region: "Şişli / Harbiye", district: "Bomonti", rating: 4.1, parking: "paid", penyeTransit: "M+T", walkMin: 9, transitDesc: "M2 Osmanbey durağına 9 dk yürüme." },
      { id: 27, name: "Radisson Hotel Istanbul Merter", region: "Diğer Bölgeler", district: "Merter", rating: 4.5, parking: "free", penyeTransit: "M+T", walkMin: 4, transitDesc: "M1 Merter durağına 4 dk yürüme." },
      { id: 28, name: "ibis Styles İstanbul Merter", region: "Diğer Bölgeler", district: "Merter", rating: 4.2, parking: "free", penyeTransit: "M+T", walkMin: 5, transitDesc: "M1/T1 durağına 5 dk yürüme." },
      { id: 29, name: "Ramada Hotel & Suites Merter", region: "Diğer Bölgeler", district: "Merter", rating: 4.3, parking: "free", penyeTransit: "M+T", walkMin: 4, transitDesc: "M1 Merter durağına 4 dk yürüme." },
      { id: 30, name: "Novotel Zeytinburnu", region: "Diğer Bölgeler", district: "Zeytinburnu", rating: 4.2, parking: "free", penyeTransit: "O", walkMin: 5, transitDesc: "Otobüs durağına 5 dk yürüme." },
      { id: 31, name: "Holiday Inn Express Ataköy Metro", region: "Diğer Bölgeler", district: "Ataköy", rating: 4.1, parking: "free", penyeTransit: "M+T", walkMin: 3, transitDesc: "M1 Ataköy durağına 3 dk yürüme." },
      { id: 32, name: "Hampton by Hilton Istanbul Old City", region: "Laleli / Fatih", district: "Yenikapı", rating: 4.3, parking: "free", penyeTransit: "M", walkMin: 4, transitDesc: "Yenikapı Aktarma Merkezine 4 dk yürüme." },
      { id: 33, name: "Ramada Encore Bayrampaşa", region: "Bayrampaşa", district: "Bayrampaşa", rating: 4.0, parking: "free", penyeTransit: "M+T", walkMin: 7, transitDesc: "Metro durağına 7 dk yürüme." }
    ];

    let savedPrices = JSON.parse(localStorage.getItem('hotel_prices_db')) || {};
    let savedBreakfast = JSON.parse(localStorage.getItem('hotel_breakfast_db')) || {};

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const tomorrow = new Date(today);
      tomorrow.setDate(tomorrow.getDate() + 1);

      document.getElementById('checkInDate').value = formatDate(today);
      document.getElementById('checkOutDate').value = formatDate(tomorrow);

      renderHotels();
    });

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    // Giriş Tarihi Seçildiğinde
    function handleInChange(val) {
      if (!val) return;
      const inDate = new Date(val);
      const outInput = document.getElementById('checkOutDate');
      if (outInput.value && new Date(outInput.value) <= inDate) {
        const nextDay = new Date(inDate);
        nextDay.setDate(nextDay.getDate() + 1);
        outInput.value = formatDate(nextDay);
      }
      renderHotels();
    }

    // Çıkış Tarihi Seçildiğinde
    function handleOutChange(val) {
      if (!val) return;
      const outDate = new Date(val);
      const inInput = document.getElementById('checkInDate');
      if (inInput.value && new Date(inInput.value) >= outDate) {
        const prevDay = new Date(outDate);
        prevDay.setDate(prevDay.getDate() - 1);
        inInput.value = formatDate(prevDay);
      }
      renderHotels();
    }

    function resetAllPrices() {
      if (confirm("Girmiş olduğunuz tüm otel fiyatları silinecek. Emin misiniz?")) {
        savedPrices = {};
        localStorage.removeItem('hotel_prices_db');
        renderHotels();
      }
    }

    function savePrice(id, price) {
      if (price === '' || price === null) {
        delete savedPrices[id];
      } else {
        savedPrices[id] = parseFloat(price);
      }
      localStorage.setItem('hotel_prices_db', JSON.stringify(savedPrices));
      renderHotels();
    }

    function toggleBreakfast(id) {
      savedBreakfast[id] = !savedBreakfast[id];
      localStorage.setItem('hotel_breakfast_db', JSON.stringify(savedBreakfast));
      renderHotels();
    }

    function getFilteredHotels() {
      const region = document.getElementById('districtFilter').value;
      const sort = document.getElementById('sortSelect').value;

      let list = hotelsData.filter(h => region === 'all' || h.region === region);

      if (sort === 'priceAsc') {
        list.sort((a, b) => {
          const pA = savedPrices[a.id] !== undefined ? savedPrices[a.id] : 999999;
          const pB = savedPrices[b.id] !== undefined ? savedPrices[b.id] : 999999;
          return pA - pB;
        });
      } else if (sort === 'ratingDesc') {
        list.sort((a, b) => b.rating - a.rating);
      } else if (sort === 'walkAsc') {
        list.sort((a, b) => a.walkMin - b.walkMin);
      }

      return list;
    }

    function renderHotels() {
      const listContainer = document.getElementById('hotelList');
      const filtered = getFilteredHotels();
      document.getElementById('hotelCount').innerText = `${filtered.length} Otel`;

      const checkIn = document.getElementById('checkInDate').value;
      const checkOut = document.getElementById('checkOutDate').value;

      listContainer.innerHTML = '';

      filtered.forEach(hotel => {
        const price = savedPrices[hotel.id] !== undefined ? savedPrices[hotel.id] : '';
        const hasBreakfast = savedBreakfast[hotel.id] || false;

        let transitBadgeClass = 'bg-amber-500';
        if (hotel.penyeTransit === 'T') transitBadgeClass = 'bg-emerald-600';
        if (hotel.penyeTransit === 'M') transitBadgeClass = 'bg-blue-600';
        if (hotel.penyeTransit === 'M+T') transitBadgeClass = 'bg-purple-600';

        let parkingHTML = '';
        if (hotel.parking === 'free') {
          parkingHTML = `<span class="bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5" title="Ücretsiz Otopark"><i data-lucide="square-p" class="w-3.5 h-3.5"></i> Ücretsiz P</span>`;
        } else if (hotel.parking === 'paid') {
          parkingHTML = `<span class="bg-amber-50 text-amber-700 border border-amber-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5" title="Ücretli Otopark"><i data-lucide="square-p" class="w-3.5 h-3.5"></i> P₺ Ücretli</span>`;
        } else {
          parkingHTML = `<span class="bg-red-50 text-red-500 border border-red-200 font-bold text-[10px] px-1.5 py-0.5 rounded flex items-center gap-0.5 line-through opacity-75" title="Otopark Yok"><i data-lucide="square-p" class="w-3.5 h-3.5"></i> P Yok</span>`;
        }

        const googleUrl = `https://www.google.com/travel/hotels/search?q=${encodeURIComponent(hotel.name + ' ' + hotel.district)}&dates=${checkIn},${checkOut}`;
        const trivagoUrl = `https://www.trivago.com.tr/tr/srl?q=${encodeURIComponent(hotel.name)}&checkIn=${checkIn}&checkOut=${checkOut}&adults=2`;

        const card = document.createElement('div');
        card.className = `bg-white p-3 rounded-xl border shadow-sm flex flex-col justify-between transition ${price !== '' ? 'border-blue-400 ring-1 ring-blue-100' : 'border-slate-200'}`;

        card.innerHTML = `
          <div>
            <div class="flex items-start justify-between gap-1 mb-1.5">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="badge-transit ${transitBadgeClass} text-white">${hotel.penyeTransit}</span>
                  <h3 class="font-bold text-slate-800 text-xs sm:text-sm leading-tight">${hotel.name}</h3>
                </div>
                <span class="inline-block bg-slate-100 text-slate-600 text-[9px] px-1.5 py-0.5 rounded mt-1 font-medium">${hotel.region}</span>
              </div>
              <span class="bg-amber-50 text-amber-700 text-[10px] font-bold px-1 py-0.5 rounded border border-amber-200 flex-shrink-0">⭐ ${hotel.rating}</span>
            </div>

            <div class="text-[11px] bg-slate-50 p-1.5 rounded-lg text-slate-600 border border-slate-100 mb-2 space-y-0.5">
              <div class="flex items-center gap-1 text-slate-700 font-medium">
                <i data-lucide="footprints" class="w-3 h-3 text-blue-500"></i>
                <span>Durağa Yürüme: <strong>${hotel.walkMin} dakika</strong></span>
              </div>
              <p class="text-[10px] text-slate-500">${hotel.transitDesc}</p>
            </div>

            <div class="flex items-center justify-between gap-1 mb-2">
              ${parkingHTML}
              <button onclick="toggleBreakfast(${hotel.id})" class="flex items-center gap-1 px-2 py-0.5 rounded text-[11px] transition ${hasBreakfast ? 'bg-emerald-100 text-emerald-800 font-medium border border-emerald-300' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">
                <i data-lucide="${hasBreakfast ? 'check-square' : 'square'}" class="w-3 h-3 ${hasBreakfast ? 'text-emerald-600' : 'text-slate-400'}"></i>
                <span>Kahvaltı</span>
              </button>
            </div>
          </div>

          <div class="pt-2 border-t border-slate-100 space-y-1.5">
            <div class="flex items-center justify-between bg-blue-50/60 p-1 rounded-lg border border-blue-100">
              <span class="text-[11px] font-medium text-slate-600">Gördüğün Fiyat:</span>
              <div class="flex items-center">
                <span class="text-xs font-bold text-blue-600 mr-1">₺</span>
                <!-- YALNIZCA SAYI KLAVYESİ AÇAN INPUT -->
                <input type="number" inputmode="decimal" pattern="[0-9]*" value="${price}" oninput="savePrice(${hotel.id}, this.value)" placeholder="Fiyat Gir" class="w-20 bg-white border border-slate-300 rounded px-1.5 py-0.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500 text-right">
              </div>
            </div>

            <div class="grid grid-cols-2 gap-1.5">
              <a href="${googleUrl}" target="_blank" class="flex items-center justify-center gap-1 bg-blue-600 hover:bg-blue-700 text-white p-1.5 rounded-lg text-[11px] font-medium transition shadow-sm">
                <i data-lucide="search" class="w-3 h-3"></i>
                <span>Google</span>
              </a>
              <a href="${trivagoUrl}" target="_blank" class="flex items-center justify-center gap-1 bg-amber-500 hover:bg-amber-600 text-white p-1.5 rounded-lg text-[11px] font-medium transition shadow-sm">
                <i data-lucide="external-link" class="w-3 h-3"></i>
                <span>Trivago</span>
              </a>
            </div>
          </div>
        `;

        listContainer.appendChild(card);
      });

      lucide.createIcons();
    }
  </script>
</body>
</html>
